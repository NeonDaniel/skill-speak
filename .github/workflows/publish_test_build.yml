# This workflow will generate a distribution and upload it to PyPI

name: Publish Alpha Build
on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'version.py'

jobs:
  build_and_publish_pypi:
    uses: neongeckocom/.github/.github/workflows/publish_alpha_release.yml@FEAT_UpdateSkillJsonAction
    secrets: inherit
    with:
      version_file: "version.py"
      publish_prerelease: true
      publish_pypi: False
      update_skill_json: True
